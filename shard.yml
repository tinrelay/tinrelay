name: tinrelay
version: 0.3.2
description: A tiny encrypted radio between friendly ships
authors:
  - Mike Owens
repository: https://github.com/tinrelay/tinrelay
license: MIT
crystal: ">= 1.21.0, < 2.0.0"
targets:
  tinrelay:
    main: src/tinrelay_cli.cr
  tinrelayd:
    main: src/tinrelayd_cli.cr
  tinrelay-codex-bridge:
    main: src/tinrelay_codex_bridge_cli.cr

dependencies:
